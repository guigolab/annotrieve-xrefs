services:

  annotrieve-xrefs-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    volumes:
      - /data/annotrieve-xrefs/logs:/var/log/nginx
    labels:
      - "traefik.enable=true"
      # Higher priority than Annotrieve's PathPrefix(`/annotrieve`) so this
      # path is not swallowed by the shorter prefix.
      - "traefik.http.routers.annotrieve-xrefs-nginx.rule=(Host(`genome.crg.es`) || Host(`genome.crg.cat`) || Host(`genome.crg.eu`)) && PathPrefix(`/annotrieve-xrefs`)"
      - "traefik.http.routers.annotrieve-xrefs-nginx.priority=100"
      - "traefik.http.routers.annotrieve-xrefs-nginx.tls=true"
      - "traefik.http.routers.annotrieve-xrefs-nginx.entrypoints=web_https"
      - "traefik.http.services.annotrieve-xrefs-nginx.loadBalancer.server.port=80"
      - "traefik.http.middlewares.annotrieve-xrefs-ratelimit.ratelimit.average=3"
      - "traefik.http.middlewares.annotrieve-xrefs-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.annotrieve-xrefs-ratelimit.ratelimit.burst=9"
      - "traefik.http.middlewares.annotrieve-xrefs-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=0"
      - "traefik.http.routers.annotrieve-xrefs-nginx.middlewares=annotrieve-xrefs-ratelimit"
    networks:
      - monstre
    depends_on:
      - annotrieve-xrefs-api

  annotrieve-xrefs-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: annotrieve-xrefs-api
    restart: always
    env_file:
      - path: .env
        required: false
    volumes:
      - /data/annotrieve/gene_corpus:/data/gene_corpus:ro
      - ${ANNOTATIONS_DATA_PATH:-/data/annotrieve/files}:/data/annotations:ro
      - xrefs_tmp:/tmp
      # Results and scratch of /sequences: shared storage, not local disk. Must be writable by the
      # container user (uid 1000): mkdir -p /data/annotrieve-xrefs/sequences
      - /data/annotrieve-xrefs/sequences:/data/results
    environment:
      - GENE_CORPUS_DIR=/data/gene_corpus
      - PRESENCE_DIR=/data/gene_corpus/serve
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://genome.crg.es/annotrieve-xrefs/api/v1}
      - SEQUENCES_RESULTS_DIR=/data/results
      - NCBI_RATE_STATE_FILE=/tmp/annotrieve-ncbi-rate   # local on purpose: flock is unreliable on NFS
      - SEQUENCES_MAX_RESULTS=100
      - SEQUENCES_IP_MAX_ACTIVE=2
      - SEQUENCES_IP_MAX_PER_HOUR=20
      - TRUSTED_PROXY_HOPS=1
      - ANNOTATIONS_DIR=/data/annotations
      - NCBI_WORKERS=4
      - NCBI_PROCESSES=2        # only used if the shared rate file cannot be opened
      - PYTHONPATH=/home/appuser
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - TMPDIR=/tmp
    expose:
      - "5000"
    networks:
      - monstre

volumes:
  xrefs_tmp:

networks:
  monstre:
    external:
      name: monstre
