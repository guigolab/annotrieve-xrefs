services:

  annotrieve-xrefs-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    volumes:
      - /data/annotrieve-xrefs/logs:/var/log/nginx
    labels:
      - "traefik.enable=true"
      # Higher priority than Annotrieve's PathPrefix(`/annotrieve`) so this
      # path is not swallowed by the shorter prefix.
      - "traefik.http.routers.annotrieve-xrefs-nginx.rule=(Host(`genome.crg.es`) || Host(`genome.crg.cat`) || Host(`genome.crg.eu`)) && PathPrefix(`/annotrieve-xrefs`)"
      - "traefik.http.routers.annotrieve-xrefs-nginx.priority=100"
      - "traefik.http.routers.annotrieve-xrefs-nginx.tls=true"
      - "traefik.http.routers.annotrieve-xrefs-nginx.entrypoints=web_https"
      - "traefik.http.services.annotrieve-xrefs-nginx.loadBalancer.server.port=80"
      - "traefik.http.middlewares.annotrieve-xrefs-ratelimit.ratelimit.average=5000"
      - "traefik.http.middlewares.annotrieve-xrefs-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.annotrieve-xrefs-ratelimit.ratelimit.burst=2000"
      - "traefik.http.routers.annotrieve-xrefs-nginx.middlewares=annotrieve-xrefs-ratelimit"
    networks:
      - monstre
    depends_on:
      - annotrieve-xrefs-api

  annotrieve-xrefs-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: annotrieve-xrefs-api
    restart: always
    volumes:
      - ${GENE_CORPUS_HOST_DIR}:/data/gene_corpus:ro
    environment:
      - GENE_CORPUS_DIR=/data/gene_corpus
      - PYTHONPATH=/home/appuser
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    expose:
      - "5000"
    networks:
      - monstre

networks:
  monstre:
    external:
      name: monstre
